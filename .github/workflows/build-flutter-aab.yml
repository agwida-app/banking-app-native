name: Build Play Store AAB

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/build-project-gc5s6p
    paths:
      - ".github/workflows/build-flutter-aab.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 secret"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          keytool -list -keystore "$RUNNER_TEMP/upload-keystore.jks" -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" -alias upload >/dev/null \
            || { echo "Keystore failed to open: ANDROID_KEYSTORE_BASE64 was likely pasted incorrectly, or the password is wrong"; exit 1; }

      - name: Install dependencies
        run: flutter pub get

      - name: Build signed release AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: flutter build appbundle --release

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: banking-app-release-aab
          path: flutter_app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Publish downloadable AAB
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-release-aab
          name: "نسخة Play Store (AAB)"
          body: "ملف .aab الموقّع لرفعه على Google Play Console."
          prerelease: true
          files: flutter_app/build/app/outputs/bundle/release/app-release.aab
