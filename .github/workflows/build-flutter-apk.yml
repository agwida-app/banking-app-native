name: Build Flutter APK

on:
  push:
    branches:
      - claude/build-project-gc5s6p
    paths:
      - "flutter_app/**"
      - ".github/workflows/build-flutter-apk.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK (arm64 only, smaller download)
        run: flutter build apk --debug --target-platform android-arm64 --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: banking-app-debug-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          retention-days: 30

      - name: Publish downloadable release (no login required)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug-apk
          name: "آخر نسخة تجريبية (Debug)"
          body: "يُحدَّث هذا الإصدار تلقائياً مع كل دفعة جديدة. نزّل ملف app-arm64-v8a-debug.apk أدناه وثبّته مباشرة (متوافق مع أغلب هواتف أندرويد الحديثة)."
          prerelease: true
          files: flutter_app/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
