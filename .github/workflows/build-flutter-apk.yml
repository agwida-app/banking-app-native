name: Build Flutter APK

on:
  push:
    branches:
      - claude/build-project-gc5s6p
    paths:
      - "flutter_app/**"
      - ".github/workflows/build-flutter-apk.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APKs (split per architecture, smaller downloads)
        run: flutter build apk --debug --split-per-abi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: banking-app-debug-apk
          path: flutter_app/build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Publish downloadable release (no login required)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug-apk
          name: "آخر نسخة تجريبية (Debug)"
          body: |
            يُحدَّث هذا الإصدار تلقائياً مع كل دفعة جديدة.

            اختر الملف المناسب لهاتفك:
            - **app-arm64-v8a-debug.apk** — جرّب هذا أولاً (يناسب أغلب الهواتف من 2017 فما فوق)
            - **app-armeabi-v7a-debug.apk** — إذا فشل الأول (للهواتف الأقدم/الأضعف)
            - **app-x86_64-debug.apk** — فقط للمحاكيات على الكمبيوتر
          prerelease: true
          files: flutter_app/build/app/outputs/flutter-apk/*.apk
